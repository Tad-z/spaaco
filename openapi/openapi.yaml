      properties:
        key:
          type: string
          enum: [people]
        hero:
          $ref: '#/components/schemas/Hero'
        directorySection:
          $ref: '#/components/schemas/SectionHeader'
        roleFilters:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        seo:
          $ref: '#/components/schemas/Seo'

    InsightsPage:
      type: object
      additionalProperties: false
      required: [key, hero, featured, categoryFilters, listingSection, seo]
      description: The listing grid itself is fetched from `GET /insights`.
      properties:
        key:
          type: string
          enum: [insights]
        hero:
          oneOf:
            - $ref: '#/components/schemas/Hero'
            - type: 'null'
          description: >-
            Null by design: the page opens with the featured carousel.
        featured:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InsightCard'
        categoryFilters:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        listingSection:
          $ref: '#/components/schemas/SectionHeader'
        seo:
          $ref: '#/components/schemas/Seo'

