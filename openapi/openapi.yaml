        body: { type: [string, 'null'] }
        keyServices:
          type: array
          items: { type: string }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/ObjectId' }
        featuredOnHome: { type: boolean }
        homeOrder: { type: [integer, 'null'] }
        showInFooter: { type: boolean }
        seo: { $ref: '#/components/schemas/SeoWrite' }
        _expanded: { $ref: '#/components/schemas/Expanded' }

    PersonAdmin:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - status
        - publishedAt
        - order
        - revision
        - createdAt
        - updatedAt
        - honorific
        - firstName
        - lastName
        - postNominals
        - role
        - photo
        - linkedinUrl
        - email
        - bio
        - quote
        - practiceAreas
        - office
        - featuredInLeadership
        - _expanded
      description: Unlike the public shape, this carries `email`, which the site never shows.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        slug: { $ref: '#/components/schemas/Slug' }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: [string, 'null'], format: date-time }
        order: { type: integer }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        honorific: { type: [string, 'null'] }
        firstName: { type: string }
        lastName: { type: string }
        postNominals: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/PersonRole' }
        photo:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        linkedinUrl: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        quote: { type: [string, 'null'] }
        practiceAreas:
          type: array
          items: { $ref: '#/components/schemas/ObjectId' }
        office:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
