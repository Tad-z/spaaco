openapi: 3.1.0
info:
  title: SPA Ajibade & Co. Website API
  version: 1.0.0
  description: |
    Content API for the SPA Ajibade & Co. marketing website.

    Almost every piece of copy, imagery and structured content on the public site is served
    from here, so the frontend hard-codes only layout and styling.

    ## Conventions
    - Single resources return `{ "data": { ... } }`; lists return `{ "data": [ ... ], "meta": { ... } }`.
    - Errors return `{ "error": { "code", "message", "details?" } }`.
    - Dates are ISO 8601 strings. The frontend does all formatting.
    - Rich text (`body`, `bio`, `answer`, `description`) is sanitised HTML.
    - Enums are `snake_case`, with a sibling `…Label` field wherever the UI shows text.
    - Only published content is returned, unless a request carries both `?preview=true`
      and a valid admin bearer token.

    Admin endpoints are documented separately and are added to this spec in later phases.
  contact:
    name: SPA Ajibade & Co. engineering
    email: frontoffice@spaajibade.com
  license:
    name: Proprietary
    identifier: LicenseRef-SPA-Ajibade-Proprietary

servers:
  - url: http://localhost:4000
    description: Local development
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.spaajibade.com
    description: Production

tags:
  - name: System
    description: Liveness and diagnostics.
  - name: Site
    description: The global shell shared by every page.
  - name: Pages
    description: Composed page payloads, one request per page.
  - name: Practice areas
    description: The firm's areas of practice.
  - name: People
    description: The attorney directory.
  - name: Insights
    description: Articles, firm news and video content.
  - name: Offices
    description: Lagos, Abuja and Ibadan.
  - name: Recognition
    description: The directories that rank the firm, and the awards each has given.
  - name: Legal
    description: The Terms of Service and Privacy Policy pages.
  - name: Jobs
    description: Open vacancies.
  - name: FAQs
    description: The site-wide FAQ set.
  - name: Search
    description: Header search across the main collections.
  - name: Forms
    description: Public form submissions. All are rate limited and captcha protected.
  - name: Admin auth
    description: Sign-in, token rotation and two-factor enrolment for the admin dashboard.
  - name: Admin users
    description: Managing admin accounts and reading the audit log. Administrators only.
  - name: Admin content
    description: |
      CRUD for the nine content collections. One handler serves them all, but each
      collection has its own explicit paths and schemas (ADR-033).
  - name: Admin singletons
    description: Site settings, the ten page documents and the two legal pages.
  - name: Admin media
    description: The media library the firm uploads through — images, and PDF documents.

paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      description: Reports process health and whether the database responds to a ping.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
              example:
                data:
                  status: ok
                  db: up
                  version: 1.0.0
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/site:
    get:
      tags: [Site]
      operationId: getSite
      summary: Global site shell
      description: |
        Settings, navigation, the footer (including practice areas and offices), the shared FAQ
        section and the contact callout. The frontend fetches this once and reuses it on every
        page, so these sections are never repeated inside page payloads.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The site shell.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Site'
              examples:
                site:
                  value:
                    $ref: '../fixtures/responses/site.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: |
            The site has never been configured: there is no settings document.
            Only reachable on an unseeded environment, never in production.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Site settings not found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/pages/{key}:
    get:
      tags: [Pages]
      operationId: getPage
      summary: Composed page payload
      description: |
        Returns one page document with every referenced collection already embedded, so a page
        renders from a single request. The response shape is discriminated by `key`.

        The FAQ section, contact callout and footer are deliberately absent here; they come from
        `GET /site`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The composed page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Page'
              examples:
                home:
                  summary: home
                  value:
                    $ref: '../fixtures/responses/pages.home.json'
                about:
                  summary: about
                  value:
                    $ref: '../fixtures/responses/pages.about.json'
                practice-areas:
                  summary: practice-areas
                  value:
                    $ref: '../fixtures/responses/pages.practice-areas.json'
                people:
                  summary: people
                  value:
                    $ref: '../fixtures/responses/pages.people.json'
                insights:
                  summary: insights
                  value:
                    $ref: '../fixtures/responses/pages.insights.json'
                careers:
                  summary: careers
                  value:
                    $ref: '../fixtures/responses/pages.careers.json'
                faq:
                  summary: faq
                  value:
                    $ref: '../fixtures/responses/pages.faq.json'
                offices:
                  summary: offices
                  value:
                    $ref: '../fixtures/responses/pages.offices.json'
                recognition:
                  summary: recognition
                  value:
                    $ref: '../fixtures/responses/pages.recognition.json'
                responsible-business:
                  summary: responsible-business
                  value:
                    $ref: '../fixtures/responses/pages.responsible-business.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/practice-areas:
    get:
      tags: [Practice areas]
      operationId: listPracticeAreas
      summary: List practice areas
      description: Every published practice area, in the manual order set by the firm.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: All published practice areas.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PracticeAreaCard'
              examples:
                practiceAreas:
                  value:
                    $ref: '../fixtures/responses/practice-areas.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/practice-areas/{slug}:
    get:
      tags: [Practice areas]
      operationId: getPracticeArea
      summary: Practice area detail
      description: |
        The practice area detail page: the hero copy and images, the overview, core services,
        approach and industries, the Practice Lead card, the sidebar list of every published
        area (`siblings`), and the six most recent publications tagged with this area. Pro bono
        insights are never among them (see `GET /insights`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The practice area.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PracticeAreaDetail'
              examples:
                disputeResolution:
                  value:
                    $ref: '../fixtures/responses/practice-areas.detail.dispute-resolution.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/people:
    get:
      tags: [People]
      operationId: listPeople
      summary: Attorney directory
      description: |
        Paginated attorney directory. The default sort is `seniority`: role rank first
        (managing partner through trainee associate), then the manual order, then last name.

        `role` and `practiceArea` combine: the designs' role tabs sit alongside a "Practice Area"
        dropdown (labelled "Sort By" on screen), and both apply at once.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonRole'
        - $ref: '#/components/parameters/PracticeAreaFilter'
        - $ref: '#/components/parameters/PersonSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: A page of attorneys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                people:
                  value:
                    $ref: '../fixtures/responses/people.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/people/{slug}:
    get:
      tags: [People]
      operationId: getPerson
      summary: Attorney profile
      description: |
        The full profile: bio, education, memberships, contact links (email is public), the
        primary practice area shown under the portrait, and the six latest insights they wrote.
        Pro bono insights are never among them.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The attorney.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PersonDetail'
              examples:
                babatundeAjibade:
                  value:
                    $ref: '../fixtures/responses/people.detail.babatunde-ajibade.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/insights:
    get:
      tags: [Insights]
      operationId: listInsights
      summary: Insights and news listing
      description: |
        Paginated insight cards, newest first by default.

        `pro_bono` insights appear **only** when `category=pro_bono` is requested explicitly —
        that is the Responsible Business grid. Every other listing, including the unfiltered
        "All insights & news" tab, leaves them out, as the designs do.

        `category` and `practiceArea` combine: the category tabs sit alongside a "Practice Area"
        dropdown (labelled "Sort By" on screen).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InsightCategory'
        - $ref: '#/components/parameters/PracticeAreaFilter'
        - $ref: '#/components/parameters/InsightSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: A page of insights.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsightCard'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                insights:
                  value:
                    $ref: '../fixtures/responses/insights.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/insights/{slug}:
    get:
      tags: [Insights]
      operationId: getInsight
      summary: Insight detail
      description: |
        The full article body, or the video URL for video content, plus the author block,
        practice areas and three related insights.

        `cta` is the link rendered after the body: "Read Article" (to the external article or
        the uploaded PDF) for an article, "Watch Video" for a video, and null for an article
        with neither. `backLink` returns to the listing the insight belongs to — the Responsible
        Business page for a pro bono story, Insights & News for everything else.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The insight.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/InsightDetail'
              examples:
                tradeSecrets:
                  value:
                    $ref: '../fixtures/responses/insights.detail.trade-secrets.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/offices:
    get:
      tags: [Offices]
      operationId: listOffices
      summary: List offices
      description: >-
        Every published office, in the order used across the site: Lagos, Abuja, Ibadan.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: All offices.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Office'
              examples:
                offices:
                  value:
                    $ref: '../fixtures/responses/offices.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/recognitions:
    get:
      tags: [Recognition]
      operationId: listRecognitions
      summary: Recognition directories and featured awards
      description: |
        Serves the two-tab recognition component ("Our Achievements" / "Independently
        Recognized By"): every published directory with its wordmark, and the awards flagged
        for Home. The component exists in the designs but is not placed on a page yet.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: Directories and featured awards.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecognitionsOverview'
              examples:
                recognitions:
                  value:
                    $ref: '../fixtures/responses/recognitions.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/recognitions/{slug}:
    get:
      tags: [Recognition]
      operationId: getRecognitionDirectory
      summary: One directory's recognition page
      description: |
        The page behind each About "View Awards" row: a hero titled with the directory's name,
        and every published award it has given, newest year first. The eyebrow and the two hero
        CTAs are shared by every directory and edited in the `recognition` page document.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The directory page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecognitionDirectoryPage'
              examples:
                iflr1000:
                  value:
                    $ref: '../fixtures/responses/recognitions.detail.iflr-1000.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/legal/{key}:
    get:
      tags: [Legal]
      operationId: getLegalPage
      summary: A legal page
      description: |
        The Terms of Service (`terms`) or the Privacy Policy (`privacy`), linked from the
        footer. Any other key, or a page the firm has not published, returns 404.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LegalKey'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The legal page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LegalPage'
              examples:
                terms:
                  value:
                    $ref: '../fixtures/responses/legal.detail.terms.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List open jobs
      description: Open vacancies only. Closed roles and roles past their closing date are excluded.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: All open jobs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
              examples:
                jobs:
                  value:
                    $ref: '../fixtures/responses/jobs.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Job detail
      description: One open vacancy.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
              examples:
                associate:
                  value:
                    $ref: '../fixtures/responses/jobs.detail.associate.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/faqs:
    get:
      tags: [FAQs]
      operationId: listFaqs
      summary: List FAQs
      description: The site-wide FAQ set, in order. The same items are embedded in `GET /site`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: All published FAQs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Faq'
              examples:
                faqs:
                  value:
                    $ref: '../fixtures/responses/faqs.list.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/search:
    get:
      tags: [Search]
      operationId: search
      summary: Header search
      description: |
        Full-text search across practice areas, attorneys and insights, ranked by text score.
        At most five results per group.

        Published content only: unlike the other public GETs, search has no preview mode, so
        drafts never surface here even for an authenticated admin.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Grouped search results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SearchResults'
              examples:
                search:
                  value:
                    $ref: '../fixtures/responses/search.json'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/enquiries:
    post:
      tags: [Forms]
      operationId: createEnquiry
      summary: Submit a mandate enquiry
      description: |
        Backs the "Discuss a Mandate" call to action. Rate limited to 5 requests per 10 minutes
        per IP. The response carries only a reference; nothing personal is echoed back.

        A submission with a non-empty `website` honeypot receives a 201 with a reference, and
        nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnquiryRequest'
            example:
              fullName: Adaeze Nwosu
              email: adaeze.nwosu@example.com
              phone: '+2348030000000'
              organization: Meridian Capital Partners
              practiceArea: corporate-finance-capital-markets
              summary: >-
                We are preparing a bond issuance and need counsel on the SEC filing timetable and
                the related corporate restructuring.
              consent: true
              consentTextVersion: '2026-01'
              turnstileToken: test
              website: ''
      responses:
        '201':
          $ref: '#/components/responses/SubmissionAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/messages:
    post:
      tags: [Forms]
      operationId: createMessage
      summary: Message the firm
      description: |
        Backs the "Message the firm" action in the FAQ card and on the offices page. Rate limited
        to 5 requests per 10 minutes per IP.

        A submission with a non-empty `website` honeypot receives a 201 with a reference, and
        nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            example:
              fullName: Ibrahim Danladi
              email: ibrahim.danladi@example.com
              subject: Question about an existing matter
              message: Could someone confirm who is handling our trademark renewal this quarter?
              consent: true
              consentTextVersion: '2026-01'
              turnstileToken: test
              website: ''
      responses:
        '201':
          $ref: '#/components/responses/SubmissionAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{id}/applications:
    post:
      tags: [Forms]
      operationId: createApplication
      summary: Apply for a job
      description: |
        Backs "Send your CV". Multipart, because it carries the CV file.

        The CV must be a PDF or DOCX of at most 5 MB. The type is checked by magic bytes, not by
        file extension, and the file is virus scanned before it is stored. Stored CVs are private
        and are only ever served through short-lived signed URLs from the admin API.

        Because multipart fields arrive as strings, `consent` is sent as the string `"true"`.

        A submission with a non-empty `website` honeypot receives a 201 with a reference, and
        nothing is stored.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
            encoding:
              cv:
                contentType: >-
                  application/pdf,
                  application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        '201':
          $ref: '#/components/responses/SubmissionAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/auth/login:
    post:
      tags: [Admin auth]
      operationId: adminLogin
      summary: Sign in
      description: |
        Returns a short-lived access token in the body and sets a rotating
        refresh token as an httpOnly cookie.

        Accounts with 2FA enabled must send `totp`; without it the response is a
        401 whose `details` carry `TOTP_REQUIRED`, which is the signal to prompt
        for a code rather than to treat the password as wrong.

        Rate limited to 5 attempts per 15 minutes per IP and email, and the
        account locks after 10 consecutive failures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: editor
              password: a-correct-horse-battery-staple
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn: 900
                  user:
                    id: 665f1a2b3c4d5e6f70819293
                    username: editor
                    name: Ada Nwosu
                    email: editor@spaajibade.com
                    roles: [editor]
                    isActive: true
                    lastLoginAt: '2026-09-23T09:12:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/auth/refresh:
    post:
      tags: [Admin auth]
      operationId: adminRefresh
      summary: Exchange the refresh cookie for a new access token
      description: |
        Rotates the refresh token: the presented one is revoked and a new cookie
        is issued.

        Presenting an already-revoked token means it has been replayed, so the
        entire token chain for that session is revoked and the response is 401.
        Signing in again is the only way back.
      responses:
        '200':
          description: A new access token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn: 900
                  user:
                    id: 665f1a2b3c4d5e6f70819293
                    username: editor
                    name: Ada Nwosu
                    email: editor@spaajibade.com
                    roles: [editor]
                    isActive: true
                    lastLoginAt: '2026-09-23T09:12:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/auth/logout:
    post:
      tags: [Admin auth]
      operationId: adminLogout
      summary: Sign out
      description: Revokes the refresh token and clears the cookie. Always succeeds.
      responses:
        '204':
          description: Signed out.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

