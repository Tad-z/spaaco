    SiteFaqSection:
      type: object
      additionalProperties: false
      required: [eyebrow, title, items, stillHaveQuestions]
      properties:
        eyebrow:
          type: [string, 'null']
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Faq'
        stillHaveQuestions:
          $ref: '#/components/schemas/StillHaveQuestions'

    ContactCallout:
      type: object
      additionalProperties: false
      required: [title, text, primaryCta, secondaryCta]
      properties:
        title:
          type: string
        text:
          type: string
        primaryCta:
          $ref: '#/components/schemas/NullableLink'
        secondaryCta:
          $ref: '#/components/schemas/NullableLink'

    Site:
      type: object
      additionalProperties: false
      required: [settings, nav, footer, faqSection, contactCallout]
      properties:
        settings:
          $ref: '#/components/schemas/SiteSettings'
        nav:
          type: array
          items:
            $ref: '#/components/schemas/NavItem'
        footer:
          $ref: '#/components/schemas/SiteFooter'
        faqSection:
          $ref: '#/components/schemas/SiteFaqSection'
        contactCallout:
          $ref: '#/components/schemas/ContactCallout'

    SearchResults:
      type: object
      additionalProperties: false
      required: [practiceAreas, people, insights]
      properties:
        practiceAreas:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PracticeAreaCard'
        people:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PersonSummary'
        insights:
          type: array
          maxItems: 5
          items:
