        The CSR page. Its grid is `GET /insights?category=pro_bono`, 9 per page. The nav
        highlights Practice Areas while it is open.
      properties:
        key:
          type: string
          enum: [responsible-business]
        title:
          type: string
          examples: ['RESPONSIBLE BUSINESS']
        images:
          type: array
          description: The carousel. Empty until the firm uploads them.
          items:
            $ref: '#/components/schemas/Image'
        backLink:
          $ref: '#/components/schemas/Link'
        seo:
          $ref: '#/components/schemas/Seo'

    LegalPage:
      type: object
      additionalProperties: false
      required: [key, title, body, updatedAt]
      properties:
        key:
          $ref: '#/components/schemas/LegalPageKey'
        title:
          type: string
        body:
          type: string
          description: Sanitised HTML.
        updatedAt:
          type: string
          format: date-time
          description: When the page was last edited, for a "Last updated" line.

    Page:
      oneOf:
        - $ref: '#/components/schemas/HomePage'
        - $ref: '#/components/schemas/AboutPage'
        - $ref: '#/components/schemas/PracticeAreasPage'
        - $ref: '#/components/schemas/PeoplePage'
        - $ref: '#/components/schemas/InsightsPage'
        - $ref: '#/components/schemas/CareersPage'
        - $ref: '#/components/schemas/FaqPage'
        - $ref: '#/components/schemas/OfficesPage'
        - $ref: '#/components/schemas/RecognitionPage'
        - $ref: '#/components/schemas/ResponsibleBusinessPage'
      discriminator:
        propertyName: key
        mapping:
          home: '#/components/schemas/HomePage'
          about: '#/components/schemas/AboutPage'
          practice-areas: '#/components/schemas/PracticeAreasPage'
          people: '#/components/schemas/PeoplePage'
          insights: '#/components/schemas/InsightsPage'
          careers: '#/components/schemas/CareersPage'
          faq: '#/components/schemas/FaqPage'
          offices: '#/components/schemas/OfficesPage'
          recognition: '#/components/schemas/RecognitionPage'
          responsible-business: '#/components/schemas/ResponsibleBusinessPage'

    SubmissionReceipt:
      type: object
      additionalProperties: false
      required: [reference]
      description: |
        The only thing a form returns. Nothing the submitter typed is echoed back.
      properties:
        reference:
          type: string
          pattern: '^(ENQ|MSG|APP)-[0-9A-HJ-NP-Z]{6}$'
          examples: ['ENQ-7F3K2A']

    EnquiryRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, summary, consent, consentTextVersion, turnstileToken]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
          description: E.164, or a Nigerian local format such as `08030000000`.
        organization:
          type: string
          maxLength: 160
        practiceArea:
          $ref: '#/components/schemas/Slug'
        preferredOffice:
          $ref: '#/components/schemas/ObjectId'
        summary:
          type: string
          minLength: 20
          maxLength: 2000
        consent:
          const: true
        consentTextVersion:
          type: string
          maxLength: 40
        turnstileToken:
          type: string
          maxLength: 2048
        website:
          type: string
          maxLength: 200
          description: Honeypot; leave empty.

    MessageRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, message, consent, consentTextVersion, turnstileToken]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        subject:
          type: string
          maxLength: 160
        message:
          type: string
          minLength: 10
          maxLength: 2000
        consent:
          const: true
        consentTextVersion:
          type: string
          maxLength: 40
        turnstileToken:
          type: string
          maxLength: 2048
        website:
          type: string
          maxLength: 200
          description: Honeypot; leave empty.

    ApplicationRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, cv, consent, consentTextVersion, turnstileToken]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        coverNote:
          type: string
          maxLength: 2000
        cv:
          type: string
          format: binary
          description: A PDF or DOCX file of at most 5 MB, verified by magic bytes.
        consent:
          type: string
          enum: ['true']
          description: Multipart fields arrive as strings, so this is the string `"true"`.
        consentTextVersion:
          type: string
          maxLength: 40
        turnstileToken:
          type: string
          maxLength: 2048
        website:
          type: string
          maxLength: 200
          description: Honeypot; leave empty.

    UserRole:
      type: string
      enum: [admin, editor, hr, business_dev]
      description: |
        Which areas a user may work in. See the role matrix in docs/API.md:
        `admin` everything, `editor` content, `hr` jobs and applications,
        `business_dev` enquiries and messages.

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, name, email, roles, isActive, lastLoginAt]
      description: |
        An admin account, one per role (ADR-043). Password hashes are never
        returned.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        username:
          type: string
          description: |
            The login identifier, and the role name — `admin`, `editor`, `hr`
            or `business_dev`.
        name:
          type: string
          description: Display name, editable by the holder.
        email:
          type: [string, 'null']
          format: email
          description: |
            Where this role's notifications go. Null until the holder sets it
            from the dashboard; it is not a credential.
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 40
          description: |
            The role name: `admin`, `editor`, `hr` or `business_dev`.
        password:
          type: string
          minLength: 12
          maxLength: 200

    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Your own display name and notification address. Nothing else about an
        account is self-editable — roles and activation belong to an admin.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
          description: Null clears it, which stops this role's notifications.

    LoginResult:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, user]
      description: |
        The refresh token is not in this body: it is set as an httpOnly,
        SameSite=Strict cookie scoped to the auth path, so script on the admin
        dashboard cannot read it.
      properties:
        accessToken:
          type: string
          description: A short-lived JWT. Keep it in memory, never in storage.
        expiresIn:
          type: integer
          description: Lifetime of the access token, in seconds.
        user:
          $ref: '#/components/schemas/AdminUser'

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 200
        newPassword:
          type: string
          minLength: 12
          maxLength: 200

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, name, password, roles]
      description: |
        The four role accounts are created at first boot from the environment
        (ADR-043); this exists for the rarer case of an extra account.
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 40
          pattern: '^[a-z][a-z0-9_-]*$'
          description: The login identifier. Lowercase, no spaces.
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
          description: Optional. Where this account's notifications go.
        password:
          type: string
          minLength: 12
          maxLength: 200
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field. Email and password are changed by the user themselves.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean

    AuditActor:
      type: object
      additionalProperties: false
      required: [id, username, name]
      description: |
        Identified by username rather than email: the username is the stable
        account identity, while the email is a notification address the holder
        can change or clear.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        username:
          type: string
        name:
