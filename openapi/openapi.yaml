        An image is a JPEG, PNG, WebP or AVIF of at most 10 MB, and needs alt
        text. A document (`kind: document`) is a PDF of at most 20 MB, and needs
        a title. The type is checked by magic bytes rather than by extension,
        and must match the `kind` asked for. SVG is rejected because it can
        carry scripts; export badges as PNG (ADR-016).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '201':
          $ref: '#/components/responses/AdminMedia'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/media/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      tags: [Admin media]
      operationId: getMedia
      summary: One image, with everywhere it is used
      description: |
        `usedBy` is computed from the media reference registry on each request
        rather than stored, so it cannot drift out of date (ADR-013).
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AdminMedia'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Admin media]
      operationId: updateMedia
      summary: Edit alt text, title or focal point
      description: Metadata only. Replacing the file itself is a separate endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPatch'
            example:
              alt: Lady Justice statue against the Lagos skyline
              focalPoint: { x: 0.5, y: 0.35 }
      responses:
        '200':
          $ref: '#/components/responses/AdminMedia'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin media]
      operationId: deleteMedia
      summary: Delete an image
      description: |
        Allowed only when nothing references it. Otherwise 409, with `usedBy`
        in `error.details` so the dashboard can show where it is still used.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted, along with the stored file.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/media/{id}/file:
    put:
      tags: [Admin media]
      operationId: replaceMediaFile
      summary: Replace the file, keeping the id
      description: |
        The replacement must be the same kind: an image for an image, a PDF for
        a document. The id and alt text stay, so every page using this media updates at
        once. The new file gets a new URL, so no cache can serve the old one;
        the old file is deleted after the swap succeeds, every referencing
        entity is invalidated, and the action is audit-logged (ADR-013).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaReplaceRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminMedia'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/enquiries:
    get:
      tags: [Admin submissions]
