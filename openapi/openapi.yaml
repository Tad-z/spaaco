    Recognition:
      type: object
      additionalProperties: false
      required: [id, organization, title, year, badge, url, tab]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        organization:
          type: string
          examples: ['IFLR1000']
        title:
          type: string
          examples: ['Recommended Firm']
        year:
          type: [integer, 'null']
        badge:
          $ref: '#/components/schemas/NullableImage'
        url:
          type: [string, 'null']
        tab:
          $ref: '#/components/schemas/RecognitionTab'

    Faq:
      type: object
      additionalProperties: false
      required: [id, question, answer]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        question:
          type: string
        answer:
          type: string
          description: Sanitised HTML.

    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - practiceArea
        - description
        - experience
        - employmentType
        - employmentTypeLabel
        - workMode
        - workModeLabel
        - office
        - closingDate
        - chips
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        practiceArea:
          oneOf:
            - $ref: '#/components/schemas/PracticeAreaRef'
            - type: 'null'
        description:
          type: string
          description: Sanitised HTML.
        experience:
          type: [string, 'null']
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        employmentTypeLabel:
          type: string
        workMode:
          $ref: '#/components/schemas/WorkMode'
        workModeLabel:
          type: string
        office:
          oneOf:
            - $ref: '#/components/schemas/OfficeRef'
            - type: 'null'
        closingDate:
          type: [string, 'null']
          format: date-time
        chips:
          type: array
          description: >-
            The card chips, in display order: experience, type, mode, location.
          items:
            type: string

    Socials:
      type: object
      additionalProperties: false
      required: [instagram, facebook, x, linkedin, youtube]
      properties:
        instagram:
          type: [string, 'null']
        facebook:
          type: [string, 'null']
        x:
          type: [string, 'null']
        linkedin:
          type: [string, 'null']
        youtube:
          type: [string, 'null']

    SiteSettings:
      type: object
      additionalProperties: false
      required:
        [firmName, legalDescriptor, tagline, foundedYear, phone, email, socials, copyright]
      properties:
        firmName:
          type: string
        legalDescriptor:
          type: string
