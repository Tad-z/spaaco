          $ref: '#/components/schemas/Hero'
        story:
          $ref: '#/components/schemas/AboutStory'
        stats:
          $ref: '#/components/schemas/AboutStats'
        missionSection:
          $ref: '#/components/schemas/AboutMissionSection'
        principles:
          $ref: '#/components/schemas/AboutPrinciples'
        awardsList:
          $ref: '#/components/schemas/AboutAwardsList'
        seo:
          $ref: '#/components/schemas/Seo'

    CsrBanner:
