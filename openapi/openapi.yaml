      properties:
        label:
          type: string
        href:
          type: string
        kind:
          $ref: '#/components/schemas/LinkKind'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    SiteFooter:
      type: object
      additionalProperties: false
      required: [tagline, links, practiceAreas, offices, socials, copyright]
      properties:
        tagline:
          type: string
        links:
          type: array
          description: Mirrors the main nav.
          items:
            $ref: '#/components/schemas/Link'
        practiceAreas:
          type: array
          description: Only practice areas flagged for the footer.
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        offices:
          type: array
          items:
            $ref: '#/components/schemas/OfficeRef'
        socials:
          $ref: '#/components/schemas/Socials'
        copyright:
          type: string

    StillHaveQuestions:
      type: object
      additionalProperties: false
      required: [title, text, actions]
      properties:
        title:
          type: string
        text:
          type: string
        actions:
          type: array
