        videoShowcase:
          $ref: '#/components/schemas/HomeVideoShowcase'
        recognitionTabs:
          $ref: '#/components/schemas/HomeRecognitionTabs'
        recognitions:
          $ref: '#/components/schemas/HomeRecognitions'
        practiceSection:
