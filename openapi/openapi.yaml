    get:
      tags: [Admin submissions]
      operationId: getApplication
      summary: One application
      description: |
        Audit-logged. The CV is not included: it is fetched separately through a
        short-lived signed URL, so each access is attributable on its own.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AdminApplication'
        '400':
          $ref: '#/components/responses/ValidationError'
