  /api/v1/admin/applications/{id}/cv:
    get:
      tags: [Admin submissions]
      operationId: getApplicationCv
      summary: A short-lived link to the CV
      description: |
        CVs are never publicly served. This returns a signed URL valid for five
        minutes, and every call is audit-logged with the actor — so who read
        whose CV, and when, is always answerable.

        A CV that has not passed the virus scan is refused with 409, whatever
        its status: `pending` means the scan has not finished, and `infected`
        means the file must never be handed to anybody.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The link, and when it stops working.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SignedFileUrl' }
              example:
                data:
                  url: https://storage.example.com/cv/1a2b3c?signature=...&expires=1780000000
                  expiresAt: '2026-06-01T12:05:00.000Z'
                  filename: adaeze-nwosu-cv.pdf
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/files/cv/{key}:
    get:
      tags: [Admin submissions]
      operationId: downloadSignedCv
      summary: Redeem a signed CV link
      description: |
        Serves a CV to whoever holds a valid, unexpired signature. There is no
        bearer token: the signature *is* the authorisation, exactly as with a
        presigned S3 URL. It is issued only by `GET /admin/applications/{id}/cv`,
        which is HR-only and audit-logged, it covers the key and the expiry, and
        it stops working after five minutes.

        This path exists **only** when the API runs on the `local` private
        storage driver, which is development and staging. In production the
        driver is S3 and the link points at AWS, so this route is not mounted
        at all.
      parameters:
        - name: key
          in: path
          required: true
          description: The stored file's key, as the signed link carries it.
          schema:
            type: string
            pattern: '^[0-9a-fA-F-]{36}\.(pdf|docx)$'
        - name: expires
          in: query
          required: true
          description: Unix seconds. Part of what the signature covers.
          schema: { type: string }
        - name: signature
          in: query
          required: true
          schema: { type: string }
        - name: filename
          in: query
          required: false
          description: The name to save the download under.
          schema: { type: string }
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: |
            The signature is wrong, or the link has expired. One answer for
            both, so a caller cannot learn whether a key exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/revoke-sessions:
    post:
      tags: [Admin users]
      operationId: revokeUserSessions
      summary: End every session a user holds
      description: |
        Signs an account out everywhere, without needing their password. This
        is what an administrator uses when an account is compromised: it
        revokes the refresh chain *and* invalidates the access tokens already
        issued, so a stolen bearer token stops working on its next request
        rather than at the end of its fifteen minutes.

        Does not change the password and does not deactivate the account —
        both are separate, deliberate steps (see `docs/RUNBOOK.md`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '204':
          description: Every session ended.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An admin access token. On public content endpoints it is optional and only meaningful
        together with `?preview=true`, which includes draft content in the response.

  parameters:
    Preview:
      name: preview
      in: query
      required: false
      description: |
        Include draft content. Ignored unless the request also carries a valid admin bearer token.
      schema:
        type: boolean
        default: false
    PageKey:
      name: key
      in: path
      required: true
      description: Which page to compose.
      schema:
        $ref: '#/components/schemas/PageKey'
    Slug:
      name: slug
      in: path
      required: true
      description: The resource slug.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 140
      example: dispute-resolution-arbitration
    ObjectId:
      name: id
      in: path
      required: true
      description: A 24-character hexadecimal identifier.
      schema:
        $ref: '#/components/schemas/ObjectId'
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Out-of-range pages return an empty list, not a 404.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 9
    PersonRole:
      name: role
      in: query
      required: false
      description: |
        Filter the directory by role. Omit for every attorney.

        These are the directory's **tab groups**, not strictly the stored role:
        `partner` also returns the managing partner, because the designs have a
        "Partners" tab and no separate Managing Partner tab. Every other value
        matches its role exactly. The `role` field on each result is always the
        attorney's own role, so a person returned under `partner` may come back
        with `role: "managing_partner"`.
      schema:
        $ref: '#/components/schemas/PersonRoleFilter'
    PersonSort:
      name: sort
      in: query
      required: false
      description: Directory sort order.
      schema:
        type: string
        enum: [seniority, name_asc, name_desc]
        default: seniority
    InsightCategory:
      name: category
      in: query
      required: false
      description: Filter by category. Omit for all categories.
      schema:
        $ref: '#/components/schemas/InsightCategory'
    InsightPracticeArea:
      name: practiceArea
      in: query
      required: false
      description: Filter by practice area slug.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 140
    InsightSort:
      name: sort
      in: query
      required: false
      description: Listing sort order.
      schema:
        type: string
        enum: [newest, oldest]
        default: newest
    SearchQuery:
      name: q
      in: query
      required: true
      description: The search term.
      schema:
        type: string
        minLength: 2
        maxLength: 100
      example: arbitration

    AdminStatus:
      name: status
      in: query
      required: false
      description: Filter by status. Omit for every status, which is the admin default.
      schema:
        type: string
        enum: [draft, published]
    AdminSearch:
      name: q
      in: query
      required: false
      description: Free-text filter over the collection's searchable fields.
      schema:
        type: string
        maxLength: 200
    SubmissionStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by status. Omit for every status.
      schema: { $ref: '#/components/schemas/SubmissionStatus' }
    ApplicationStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by hiring stage. Omit for every stage.
      schema: { $ref: '#/components/schemas/ApplicationStatus' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `revision` read from the GET. A stale value returns 409 with the
        current revision, so two editors cannot silently overwrite each other.
      schema:
        type: string

  responses:
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                $ref: '../fixtures/responses/error.validation.json'
    NotFound:
      description: No published resource matches.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                $ref: '../fixtures/responses/error.not-found.json'
    PayloadTooLarge:
      description: The upload exceeds the 5 MB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: The uploaded file exceeds the 5 MB limit.
    UnsupportedMediaType:
      description: The uploaded file is not a PDF or DOCX.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Only PDF and DOCX files are accepted.
    UnprocessableEntity:
      description: |
        The uploaded file was rejected after inspection and nothing was stored. Today this
        means it failed the virus scan. Distinct from 400, which means a field was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FILE_REJECTED
              message: The uploaded file could not be accepted.
    Unauthenticated:
      description: |
        No valid credentials.
        which means the password was right and a code is needed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Invalid email or password
    Forbidden:
      description: Authenticated, but not permitted to act in this area.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have access to this resource
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: An account with that email already exists
    PreconditionRequired:
      description: The write needs an `If-Match` header carrying the revision read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: An If-Match header carrying the current revision is required
    AdminSettings:
      description: Site settings in their editable shape.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SettingsAdmin'
          examples:
            settings:
              value:
                $ref: '../fixtures/responses/admin.settings.json'
    AdminPage:
      description: A page document in its editable shape.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/PageAdmin'
          examples:
            home:
              value:
                $ref: '../fixtures/responses/admin.pages.home.json'
    AdminMedia:
      description: One media record, with everywhere it is used.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/MediaAdmin'
          examples:
            media:
              value:
                $ref: '../fixtures/responses/admin.media.detail.json'
    AdminEnquiry:
      description: One mandate enquiry.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/EnquiryAdmin'
          examples:
            enquiry:
              value:
                $ref: '../fixtures/responses/admin.enquiries.detail.json'
    AdminMessage:
      description: One message to the firm.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/MessageAdmin'
          examples:
            message:
              value:
                $ref: '../fixtures/responses/admin.messages.detail.json'
    AdminApplication:
      description: One job application, without the CV itself.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ApplicationAdmin'
          examples:
            application:
              value:
                $ref: '../fixtures/responses/admin.applications.detail.json'
    RateLimited:
      description: Too many requests from this IP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                $ref: '../fixtures/responses/error.rate-limited.json'
    InternalError:
      description: An unexpected error. The body never carries a stack trace or internal message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL
              message: Something went wrong.
    SubmissionAccepted:
      description: The submission was accepted.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SubmissionReceipt'
          example:
            data:
              reference: ENQ-7F3K2A

  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-f]{24}$'
      description: A 24-character hexadecimal MongoDB identifier.
      examples:
        - 665f1a2b3c4d5e6f70819293

    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 140
      description: A lowercase kebab-case identifier, unique within its collection.

    Health:
      type: object
      additionalProperties: false
      required: [status, db, version]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [up, down]
        version:
          type: string
          description: The deployed API version.

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - FILE_REJECTED
        - RATE_LIMITED
        - INTERNAL

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: A dotted path to the offending field.
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ImageSizes:
      type: object
      additionalProperties: false
      required: [sm, md, lg]
      description: Responsive variants, roughly 480, 960 and 1440 pixels wide.
      properties:
        sm:
          type: string
        md:
          type: string
        lg:
          type: string

    Image:
      type: object
      additionalProperties: false
      required: [url, alt, width, height, sizes, focalPoint]
      description: Images are always this shape, never a bare URL string.
      properties:
        url:
          type: string
        alt:
          type: string
          description: Required on every image. The admin UI enforces it on upload.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sizes:
          $ref: '#/components/schemas/ImageSizes'
        focalPoint:
          type: object
          additionalProperties: false
          required: [x, y]
          description: Relative focal point used for art-directed cropping.
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    NullableImage:
      oneOf:
        - $ref: '#/components/schemas/Image'
        - type: 'null'
      description: Null until the firm uploads an image through the admin UI.

    LinkKind:
      type: string
      enum: [internal, external, action]
      description: |
        `internal` is a path on the site, `external` an absolute URL, and `action` one of the
        frontend-resolved actions: `action:mandate`, `action:chat`, `action:message`,
        `action:call`.

    Link:
      type: object
      additionalProperties: false
      required: [label, href, kind]
      properties:
        label:
          type: string
        href:
          type: string
        kind:
          $ref: '#/components/schemas/LinkKind'

    NullableLink:
      oneOf:
        - $ref: '#/components/schemas/Link'
        - type: 'null'

    SectionHeader:
      type: object
      additionalProperties: false
      required: [eyebrow, title, cta]
      description: The eyebrow/title/CTA trio that opens most sections. Unused parts are null.
      properties:
        eyebrow:
          type: [string, 'null']
        title:
          type: string
        cta:
          $ref: '#/components/schemas/NullableLink'

    IconItem:
      type: object
      additionalProperties: false
      required: [icon, title, text]
      properties:
        icon:
          type: string
          description: An icon key the frontend maps to its own icon set, such as `shield-plus`.
        title:
          type: string
        text:
          type: [string, 'null']

    Stat:
      type: object
      additionalProperties: false
      required: [value, caption, label]
      description: |
        Computed stats are already resolved here; the `source` field is admin-only.
      properties:
        value:
          type: string
          examples: ['59+ Years']
        caption:
          type: string
        label:
          type: string

    SeoBasic:
      type: object
      additionalProperties: false
      required: [title, description]
      description: |
        Search metadata for a collection item. Unlike a page's `Seo`, there is no
        `ogImage`: only pages carry an Open Graph image.
      properties:
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']

    Seo:
      type: object
      additionalProperties: false
      required: [title, description, ogImage]
      properties:
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        ogImage:
          $ref: '#/components/schemas/NullableImage'

    Hero:
      type: object
      additionalProperties: false
      required: [title, subtitle, image, primaryCta, secondaryCta]
      properties:
        title:
          type: string
        subtitle:
          type: [string, 'null']
        image:
          $ref: '#/components/schemas/NullableImage'
        primaryCta:
          $ref: '#/components/schemas/NullableLink'
        secondaryCta:
          $ref: '#/components/schemas/NullableLink'

    FilterOption:
      type: object
      additionalProperties: false
      required: [value, label]
      description: A filter tab. An empty `value` means "no filter", such as "Our Attorneys".
      properties:
        value:
          type: string
        label:
          type: string

    PersonRole:
      type: string
      enum:
        - managing_partner
        - partner
        - associate_partner
        - senior_associate
        - associate
        - nysc_associate

    PersonRoleFilter:
      type: string
      enum:
        - managing_partner
        - partner
        - associate_partner
        - senior_associate
        - associate
        - nysc_associate
      description: |
        The accepted values of the `role` query parameter. Same values as `PersonRole`, but
        `partner` behaves as a group and also matches `managing_partner`, mirroring the
        "Partners" tab in the designs. `managing_partner` is accepted for an exact match even
        though the directory shows no tab for it.

    InsightCategory:
      type: string
      enum:
        - firm_news
        - articles
        - insights
        - regulatory_updates
        - news_updates
        - media_coverage
        - webinar_resources

    InsightFormat:
      type: string
      enum: [article, video]
      description: Controls whether the card reads "Read More" or "Watch Video".

    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, internship, nysc]

    WorkMode:
      type: string
      enum: [onsite, hybrid, remote]

    RecognitionTab:
      type: string
      enum: [achievements, recognized_by]

    PageKey:
      type: string
      enum: [home, about, practice-areas, people, insights, careers, faq, offices]

    PracticeAreaRef:
      type: object
      additionalProperties: false
      required: [id, slug, title, shortLabel]
      description: A minimal practice area, used for chips and links.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        shortLabel:
          type: string
          description: The compact label used on the Home tab bar.

    PracticeAreaCard:
      type: object
      additionalProperties: false
      required: [id, slug, title, shortLabel, summary, image]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        shortLabel:
          type: string
        summary:
          type: string
        image:
          $ref: '#/components/schemas/NullableImage'

    PracticeAreaDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          slug,
          title,
          shortLabel,
          summary,
          image,
          body,
          keyServices,
          contacts,
          relatedInsights,
          seo,
        ]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        shortLabel:
          type: string
        summary:
          type: string
        image:
          $ref: '#/components/schemas/NullableImage'
        body:
          type: [string, 'null']
          description: Sanitised HTML. Null until the firm supplies detail-page copy.
        keyServices:
          type: array
          items:
            type: string
        contacts:
          type: array
          description: The attorneys to contact about this practice area.
          items:
            $ref: '#/components/schemas/PersonSummary'
        relatedInsights:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InsightCard'
        seo:
          $ref: '#/components/schemas/SeoBasic'

    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, role, roleLabel, photo, linkedinUrl]
      description: |
        Used on directory cards, author blocks and the leadership row. `displayName` includes the
        honorific only when it is "Dr.", matching the designs, and appends any post-nominals.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        displayName:
          type: string
          examples: ['Dr. Babatunde Ajibade, SAN']
        role:
          $ref: '#/components/schemas/PersonRole'
        roleLabel:
          type: string
          examples: ['Managing Partner']
        photo:
          $ref: '#/components/schemas/NullableImage'
        linkedinUrl:
          type: [string, 'null']

    PersonDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - displayName
        - firstName
        - lastName
        - honorific
        - postNominals
        - role
        - roleLabel
        - photo
        - linkedinUrl
        - bio
        - quote
        - practiceAreas
        - office
        - insights
      description: The attorney bio. Email is deliberately never exposed publicly.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        honorific:
          type: [string, 'null']
        postNominals:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/PersonRole'
        roleLabel:
          type: string
        photo:
          $ref: '#/components/schemas/NullableImage'
        linkedinUrl:
          type: [string, 'null']
        bio:
          type: [string, 'null']
          description: Sanitised HTML.
        quote:
          type: [string, 'null']
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        office:
          oneOf:
            - $ref: '#/components/schemas/OfficeRef'
            - type: 'null'
        insights:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InsightCard'

    InsightAuthor:
      oneOf:
        - $ref: '#/components/schemas/InsightAuthorPerson'
        - $ref: '#/components/schemas/InsightAuthorFirm'
      discriminator:
        propertyName: type
        mapping:
          person: '#/components/schemas/InsightAuthorPerson'
          firm: '#/components/schemas/InsightAuthorFirm'
      description: An insight is written either by an attorney or by the firm itself.

    InsightAuthorPerson:
      type: object
      additionalProperties: false
      required: [type, person]
      properties:
        type:
          type: string
          enum: [person]
        person:
          $ref: '#/components/schemas/PersonSummary'

    InsightAuthorFirm:
      type: object
      additionalProperties: false
      required: [type, name, label]
      description: The frontend renders its own logo mark alongside these strings.
      properties:
        type:
          type: string
          enum: [firm]
        name:
          type: string
          examples: ['SPA AJIBADE & Co.']
        label:
          type: string
          examples: ['Law Firm']

    InsightCta:
      type: object
      additionalProperties: false
      required: [label, kind]
      properties:
        label:
          type: string
          examples: ['Read More']
        kind:
          type: string
          enum: [read_more, watch_video]

    InsightCard:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - excerpt
        - format
        - categories
        - categoryLabels
        - practiceAreas
        - chips
        - author
        - coverImage
        - publishedAt
        - featured
        - cta
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        excerpt:
          type: [string, 'null']
        format:
          $ref: '#/components/schemas/InsightFormat'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InsightCategory'
        categoryLabels:
          type: array
          minItems: 1
          items:
            type: string
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        chips:
          type: array
          maxItems: 2
          description: |
            The two labels the card shows: the first category, then the first practice area.
            With no practice area, the second category is used instead.
          items:
            type: string
        author:
          $ref: '#/components/schemas/InsightAuthor'
        coverImage:
          $ref: '#/components/schemas/NullableImage'
        publishedAt:
          type: [string, 'null']
          format: date-time
        featured:
          type: boolean
        cta:
          $ref: '#/components/schemas/InsightCta'

    InsightDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - excerpt
        - format
        - categories
        - categoryLabels
        - practiceAreas
        - chips
        - author
        - coverImage
        - publishedAt
        - featured
        - cta
        - body
        - videoUrl
        - related
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        excerpt:
          type: [string, 'null']
        format:
          $ref: '#/components/schemas/InsightFormat'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InsightCategory'
        categoryLabels:
          type: array
          minItems: 1
          items:
            type: string
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        chips:
          type: array
          maxItems: 2
          items:
            type: string
        author:
          $ref: '#/components/schemas/InsightAuthor'
        coverImage:
          $ref: '#/components/schemas/NullableImage'
        publishedAt:
          type: [string, 'null']
          format: date-time
        featured:
          type: boolean
        cta:
          $ref: '#/components/schemas/InsightCta'
        body:
          type: [string, 'null']
          description: Sanitised HTML. Null for video insights.
        videoUrl:
          type: [string, 'null']
          description: Set when `format` is `video`.
        related:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InsightCard'

    Coordinates:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    OfficeRef:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          examples: ['Lagos']

    Office:
      type: object
      additionalProperties: false
      required: [id, slug, name, address, hours, phone, email, coordinates, directionsUrl]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          description: The bare city name. The UI renders it as "Lagos Office".
        address:
          type: string
        hours:
          type: string
        phone:
          type: [string, 'null']
          description: Falls back to the site-wide phone number when the office has none.
        email:
          type: [string, 'null']
        coordinates:
          oneOf:
            - $ref: '#/components/schemas/Coordinates'
            - type: 'null'
          description: Null until the firm supplies real coordinates for the map pin.
        directionsUrl:
          type: [string, 'null']

    Recognition:
      type: object
      additionalProperties: false
      required: [id, organization, title, year, badge, url, tab]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        organization:
          type: string
          examples: ['IFLR1000']
        title:
          type: string
          examples: ['Recommended Firm']
        year:
          type: [integer, 'null']
        badge:
          $ref: '#/components/schemas/NullableImage'
        url:
          type: [string, 'null']
        tab:
          $ref: '#/components/schemas/RecognitionTab'

    Faq:
      type: object
      additionalProperties: false
      required: [id, question, answer]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        question:
          type: string
        answer:
          type: string
          description: Sanitised HTML.

    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - practiceArea
        - description
        - experience
        - employmentType
        - employmentTypeLabel
        - workMode
        - workModeLabel
        - office
        - closingDate
        - chips
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        practiceArea:
          oneOf:
            - $ref: '#/components/schemas/PracticeAreaRef'
            - type: 'null'
        description:
          type: string
          description: Sanitised HTML.
        experience:
          type: [string, 'null']
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        employmentTypeLabel:
          type: string
        workMode:
          $ref: '#/components/schemas/WorkMode'
        workModeLabel:
          type: string
        office:
          oneOf:
            - $ref: '#/components/schemas/OfficeRef'
            - type: 'null'
        closingDate:
          type: [string, 'null']
          format: date-time
        chips:
          type: array
          description: >-
            The card chips, in display order: experience, type, mode, location.
          items:
            type: string

    Socials:
      type: object
      additionalProperties: false
      required: [instagram, facebook, x, linkedin, youtube]
      properties:
        instagram:
          type: [string, 'null']
        facebook:
          type: [string, 'null']
        x:
          type: [string, 'null']
        linkedin:
          type: [string, 'null']
        youtube:
          type: [string, 'null']

    SiteSettings:
      type: object
      additionalProperties: false
      required: [firmName, legalDescriptor, tagline, foundedYear, phone, email, socials, copyright]
      properties:
        firmName:
          type: string
        legalDescriptor:
          type: string
          examples: ['Legal Practitioners, Arbitrators and Notaries Public']
        tagline:
          type: string
        foundedYear:
          type: integer
        phone:
          type: [string, 'null']
        email:
          type: [string, 'null']
        socials:
          $ref: '#/components/schemas/Socials'
        copyright:
          type: string

    NavItem:
      type: object
      additionalProperties: false
      required: [label, href, kind, children]
      description: |
        Dropdown contents are not designed yet. The Practice Areas dropdown is generated from the
        practice areas collection; other dropdowns currently have an empty `children` array.
      properties:
        label:
          type: string
        href:
          type: string
        kind:
          $ref: '#/components/schemas/LinkKind'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    SiteFooter:
      type: object
      additionalProperties: false
      required: [tagline, links, practiceAreas, offices, socials, copyright]
      properties:
        tagline:
          type: string
        links:
          type: array
          description: Mirrors the main nav.
          items:
            $ref: '#/components/schemas/Link'
        practiceAreas:
          type: array
          description: Only practice areas flagged for the footer.
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        offices:
          type: array
          items:
            $ref: '#/components/schemas/OfficeRef'
        socials:
          $ref: '#/components/schemas/Socials'
        copyright:
          type: string

    StillHaveQuestions:
      type: object
      additionalProperties: false
      required: [title, text, actions]
      properties:
        title:
          type: string
