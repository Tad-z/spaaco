      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          examples: ['Lagos']

    Office:
      type: object
      additionalProperties: false
      required: [id, slug, name, address, hours, phone, email, coordinates, directionsUrl]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          description: The bare city name. The UI renders it as "Lagos Office".
        address:
          type: string
        hours:
          type: string
        phone:
          type: [string, 'null']
          description: Falls back to the site-wide phone number when the office has none.
        email:
          type: [string, 'null']
        coordinates:
          oneOf:
            - $ref: '#/components/schemas/Coordinates'
