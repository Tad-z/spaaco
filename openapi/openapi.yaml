          $ref: '#/components/schemas/Hero'
        jobsSection:
          $ref: '#/components/schemas/SectionHeader'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        seo:
          $ref: '#/components/schemas/Seo'

    FaqPage:
      type: object
      additionalProperties: false
      required: [key, hero, seo]
      description: The FAQ items come from `GET /site`, not from here.
      properties:
        key:
          type: string
          enum: [faq]
        hero:
          $ref: '#/components/schemas/Hero'
        seo:
          $ref: '#/components/schemas/Seo'

    OfficesPage:
      type: object
      additionalProperties: false
      required: [key, hero, offices, seo]
      properties:
        key:
          type: string
          enum: [offices]
        hero:
          $ref: '#/components/schemas/Hero'
        offices:
          type: array
          items:
            $ref: '#/components/schemas/Office'
        seo:
          $ref: '#/components/schemas/Seo'

    Page:
      oneOf:
        - $ref: '#/components/schemas/HomePage'
        - $ref: '#/components/schemas/AboutPage'
        - $ref: '#/components/schemas/PracticeAreasPage'
        - $ref: '#/components/schemas/PeoplePage'
        - $ref: '#/components/schemas/InsightsPage'
        - $ref: '#/components/schemas/CareersPage'
        - $ref: '#/components/schemas/FaqPage'
        - $ref: '#/components/schemas/OfficesPage'
      discriminator:
        propertyName: key
        mapping:
          home: '#/components/schemas/HomePage'
          about: '#/components/schemas/AboutPage'
          practice-areas: '#/components/schemas/PracticeAreasPage'
          people: '#/components/schemas/PeoplePage'
          insights: '#/components/schemas/InsightsPage'
          careers: '#/components/schemas/CareersPage'
          faq: '#/components/schemas/FaqPage'
          offices: '#/components/schemas/OfficesPage'

    SubmissionReceipt:
      type: object
      additionalProperties: false
      required: [reference]
      description: |
        The only thing a form returns. Nothing the submitter typed is echoed back.
      properties:
        reference:
          type: string
          pattern: '^(ENQ|MSG|APP)-[0-9A-HJ-NP-Z]{6}$'
          examples: ['ENQ-7F3K2A']

    EnquiryRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, summary, consent, consentTextVersion, turnstileToken]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
          description: E.164, or a Nigerian local format such as `08030000000`.
        organization:
          type: string
          maxLength: 160
        practiceArea:
          $ref: '#/components/schemas/Slug'
        preferredOffice:
          $ref: '#/components/schemas/ObjectId'
        summary:
          type: string
          minLength: 20
          maxLength: 2000
        consent:
          const: true
        consentTextVersion:
          type: string
          maxLength: 40
        turnstileToken:
          type: string
          maxLength: 2048
        website:
          type: string
          maxLength: 200
          description: Honeypot; leave empty.

    MessageRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, message, consent, consentTextVersion, turnstileToken]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        subject:
          type: string
          maxLength: 160
        message:
          type: string
          minLength: 10
          maxLength: 2000
        consent:
          const: true
        consentTextVersion:
          type: string
          maxLength: 40
        turnstileToken:
          type: string
          maxLength: 2048
        website:
          type: string
          maxLength: 200
          description: Honeypot; leave empty.

    ApplicationRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, cv, consent, consentTextVersion, turnstileToken]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        coverNote:
          type: string
          maxLength: 2000
        cv:
          type: string
          format: binary
          description: A PDF or DOCX file of at most 5 MB, verified by magic bytes.
        consent:
          type: string
          enum: ['true']
          description: Multipart fields arrive as strings, so this is the string `"true"`.
        consentTextVersion:
          type: string
          maxLength: 40
        turnstileToken:
          type: string
          maxLength: 2048
        website:
          type: string
          maxLength: 200
          description: Honeypot; leave empty.
