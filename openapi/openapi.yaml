        tagline:
          type: string
        foundedYear:
          type: integer
        phone:
          type: [string, 'null']
        email:
          type: [string, 'null']
        socials:
          $ref: '#/components/schemas/Socials'
        copyright:
          type: string

    NavItem:
      type: object
      additionalProperties: false
      required: [label, href, kind, children]
      description: |
        Dropdown contents are not designed yet. The Practice Areas dropdown is generated from the
