        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Admin submissions]
      operationId: updateApplication
      summary: Move an application through the hiring stages
      description: |
        Status only. Everything the applicant submitted stays as they sent it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationPatch' }
            example:
              status: shortlisted
      responses:
        '200':
          $ref: '#/components/responses/AdminApplication'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/applications/{id}/cv:
    get:
      tags: [Admin submissions]
      operationId: getApplicationCv
      summary: A short-lived link to the CV
      description: |
        CVs are never publicly served. This returns a signed URL valid for five
        minutes, and every call is audit-logged with the actor — so who read
        whose CV, and when, is always answerable.

        A CV that has not passed the virus scan is refused with 409, whatever
        its status: `pending` means the scan has not finished, and `infected`
        means the file must never be handed to anybody.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: The link, and when it stops working.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SignedFileUrl' }
              example:
                data:
                  url: https://storage.example.com/cv/1a2b3c?signature=...&expires=1780000000
                  expiresAt: '2026-06-01T12:05:00.000Z'
                  filename: adaeze-nwosu-cv.pdf
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/files/cv/{key}:
    get:
      tags: [Admin submissions]
      operationId: downloadSignedCv
      summary: Redeem a signed CV link
      description: |
        Serves a CV to whoever holds a valid, unexpired signature. There is no
        bearer token: the signature *is* the authorisation, exactly as with a
        presigned S3 URL. It is issued only by `GET /admin/applications/{id}/cv`,
        which is HR-only and audit-logged, it covers the key and the expiry, and
        it stops working after five minutes.

        This path exists **only** when the API runs on the `local` private
        storage driver, which is development and staging. In production the
        driver is S3 and the link points at AWS, so this route is not mounted
        at all.
      parameters:
        - name: key
          in: path
          required: true
          description: The stored file's key, as the signed link carries it.
          schema:
            type: string
            pattern: '^[0-9a-fA-F-]{36}\.(pdf|docx)$'
        - name: expires
          in: query
          required: true
          description: Unix seconds. Part of what the signature covers.
          schema: { type: string }
        - name: signature
          in: query
          required: true
          schema: { type: string }
        - name: filename
          in: query
          required: false
          description: The name to save the download under.
          schema: { type: string }
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: |
            The signature is wrong, or the link has expired. One answer for
            both, so a caller cannot learn whether a key exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/revoke-sessions:
    post:
      tags: [Admin users]
      operationId: revokeUserSessions
      summary: End every session a user holds
      description: |
        Signs an account out everywhere, without needing their password. This
        is what an administrator uses when an account is compromised: it
        revokes the refresh chain *and* invalidates the access tokens already
        issued, so a stolen bearer token stops working on its next request
        rather than at the end of its fifteen minutes.

        Does not change the password and does not deactivate the account —
        both are separate, deliberate steps (see `docs/RUNBOOK.md`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '204':
          description: Every session ended.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An admin access token. On public content endpoints it is optional and only meaningful
        together with `?preview=true`, which includes draft content in the response.

  parameters:
    Preview:
      name: preview
      in: query
      required: false
      description: |
        Include draft content. Ignored unless the request also carries a valid admin bearer token.
      schema:
        type: boolean
        default: false
    PageKey:
      name: key
      in: path
      required: true
      description: Which page to compose.
      schema:
        $ref: '#/components/schemas/PageKey'
    Slug:
      name: slug
      in: path
      required: true
      description: The resource slug.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 140
      example: dispute-resolution-arbitration
    ObjectId:
      name: id
      in: path
      required: true
      description: A 24-character hexadecimal identifier.
      schema:
        $ref: '#/components/schemas/ObjectId'
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Out-of-range pages return an empty list, not a 404.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 9
    PersonRole:
      name: role
      in: query
      required: false
      description: |
        Filter the directory by role. Omit for every attorney.

        These are the directory's **tab groups**, not strictly the stored role:
        `partner` also returns the managing partner, because the designs have a
        "Partners" tab and no separate Managing Partner tab. Every other value
        matches its role exactly. The `role` field on each result is always the
        attorney's own role, so a person returned under `partner` may come back
        with `role: "managing_partner"`.
      schema:
        $ref: '#/components/schemas/PersonRoleFilter'
    PersonSort:
      name: sort
      in: query
      required: false
      description: Directory sort order.
      schema:
        type: string
        enum: [seniority, name_asc, name_desc]
        default: seniority
    InsightCategory:
      name: category
      in: query
      required: false
      description: Filter by category. Omit for all categories.
      schema:
        $ref: '#/components/schemas/InsightCategory'
    PracticeAreaFilter:
      name: practiceArea
      in: query
      required: false
      description: |
        Filter by practice area slug — the "Practice Area" dropdown. On `/people` it matches an
        attorney's `practiceAreas` or `primaryPracticeArea`. An unknown slug returns an empty
        page, not a 404, because the value comes from a filter control.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 140
    InsightSort:
      name: sort
      in: query
      required: false
      description: Listing sort order.
      schema:
        type: string
        enum: [newest, oldest]
        default: newest
    LegalKey:
      name: key
      in: path
      required: true
      description: Which legal page. `terms` and `privacy` exist; any other key is a 404.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 40
      example: terms
    SearchQuery:
      name: q
      in: query
      required: true
      description: The search term.
      schema:
        type: string
        minLength: 2
        maxLength: 100
      example: arbitration

    AdminStatus:
      name: status
      in: query
      required: false
      description: Filter by status. Omit for every status, which is the admin default.
      schema:
        type: string
        enum: [draft, published]
    AdminSearch:
      name: q
      in: query
      required: false
      description: Free-text filter over the collection's searchable fields.
      schema:
        type: string
        maxLength: 200
    SubmissionStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by status. Omit for every status.
      schema: { $ref: '#/components/schemas/SubmissionStatus' }
    ApplicationStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by hiring stage. Omit for every stage.
      schema: { $ref: '#/components/schemas/ApplicationStatus' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `revision` read from the GET. A stale value returns 409 with the
        current revision, so two editors cannot silently overwrite each other.
      schema:
        type: string

  responses:
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                $ref: '../fixtures/responses/error.validation.json'
    NotFound:
      description: No published resource matches.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                $ref: '../fixtures/responses/error.not-found.json'
    PayloadTooLarge:
      description: |
        The upload exceeds the limit for what it is: 5 MB for a CV, 10 MB for an image, 20 MB
        for a PDF document.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: The uploaded file exceeds the 5 MB limit.
    UnsupportedMediaType:
      description: |
        The file's bytes are not a type this upload accepts: a PDF or DOCX for a CV; a JPEG, PNG,
        WebP or AVIF for an image; a PDF for a document.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Only PDF and DOCX files are accepted.
    UnprocessableEntity:
      description: |
        The uploaded file was rejected after inspection and nothing was stored. Today this
        means it failed the virus scan: a CV, or a PDF document for the media library. Distinct from 400, which means a field was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FILE_REJECTED
              message: The uploaded file could not be accepted.
    Unauthenticated:
      description: |
        No valid credentials.
        which means the password was right and a code is needed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Invalid email or password
    Forbidden:
      description: Authenticated, but not permitted to act in this area.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have access to this resource
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: An account with that email already exists
    PreconditionRequired:
      description: The write needs an `If-Match` header carrying the revision read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: An If-Match header carrying the current revision is required
    AdminSettings:
      description: Site settings in their editable shape.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SettingsAdmin'
          examples:
            settings:
              value:
                $ref: '../fixtures/responses/admin.settings.json'
    AdminPage:
      description: A page document in its editable shape.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/PageAdmin'
          examples:
            home:
              value:
                $ref: '../fixtures/responses/admin.pages.home.json'
    AdminLegalPage:
      description: A legal page in its editable shape.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/LegalPageAdmin'
          examples:
            terms:
              value:
                $ref: '../fixtures/responses/admin.legal.terms.json'
    AdminMedia:
      description: One media record, with everywhere it is used.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/MediaAdmin'
          examples:
            media:
              value:
                $ref: '../fixtures/responses/admin.media.detail.json'
    AdminEnquiry:
      description: One mandate enquiry.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/EnquiryAdmin'
          examples:
            enquiry:
              value:
                $ref: '../fixtures/responses/admin.enquiries.detail.json'
    AdminMessage:
      description: One message to the firm.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/MessageAdmin'
          examples:
            message:
              value:
                $ref: '../fixtures/responses/admin.messages.detail.json'
    AdminApplication:
      description: One job application, without the CV itself.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ApplicationAdmin'
          examples:
            application:
              value:
                $ref: '../fixtures/responses/admin.applications.detail.json'
    RateLimited:
      description: Too many requests from this IP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                $ref: '../fixtures/responses/error.rate-limited.json'
    InternalError:
      description: An unexpected error. The body never carries a stack trace or internal message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL
              message: Something went wrong.
    SubmissionAccepted:
      description: The submission was accepted.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SubmissionReceipt'
          example:
            data:
              reference: ENQ-7F3K2A

  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-f]{24}$'
      description: A 24-character hexadecimal MongoDB identifier.
      examples:
        - 665f1a2b3c4d5e6f70819293

    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 140
      description: A lowercase kebab-case identifier, unique within its collection.

    Health:
      type: object
      additionalProperties: false
      required: [status, db, version]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [up, down]
        version:
          type: string
          description: The deployed API version.

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - FILE_REJECTED
        - RATE_LIMITED
        - INTERNAL

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: A dotted path to the offending field.
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ImageSizes:
      type: object
      additionalProperties: false
      required: [sm, md, lg]
      description: Responsive variants, roughly 480, 960 and 1440 pixels wide.
      properties:
        sm:
          type: string
        md:
          type: string
        lg:
          type: string

    Image:
      type: object
      additionalProperties: false
      required: [url, alt, width, height, sizes, focalPoint]
      description: Images are always this shape, never a bare URL string.
      properties:
        url:
          type: string
        alt:
          type: string
          description: Required on every image. The admin UI enforces it on upload.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sizes:
          $ref: '#/components/schemas/ImageSizes'
        focalPoint:
          type: object
          additionalProperties: false
          required: [x, y]
          description: Relative focal point used for art-directed cropping.
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    NullableImage:
      oneOf:
        - $ref: '#/components/schemas/Image'
        - type: 'null'
      description: Null until the firm uploads an image through the admin UI.

    Document:
      type: object
      additionalProperties: false
      required: [url, title, bytes, mimeType]
      description: |
        An uploaded PDF from the media library, such as the firm profile. Documents have no
        responsive sizes and no alt text; `title` is what a link to one should read.
      properties:
        url:
          type: string
        title:
          type: string
        bytes:
          type: integer
          minimum: 1
        mimeType:
          type: string
          enum: [application/pdf]

    NullableDocument:
      oneOf:
        - $ref: '#/components/schemas/Document'
        - type: 'null'
      description: Null until the firm uploads the document through the admin UI.

    LinkKind:
      type: string
      enum: [internal, external, action]
      description: |
        `internal` is a path on the site, `external` an absolute URL, and `action` one of the
        frontend-resolved actions: `action:mandate`, `action:chat`, `action:message`,
        `action:call`.

    Link:
      type: object
      additionalProperties: false
      required: [label, href, kind]
      properties:
        label:
          type: string
        href:
          type: string
        kind:
          $ref: '#/components/schemas/LinkKind'

    NullableLink:
      oneOf:
        - $ref: '#/components/schemas/Link'
        - type: 'null'

    PendingLink:
      type: object
      additionalProperties: false
      required: [label, href, kind]
      description: |
        A call to action the design shows before its destination is decided. The label is real
        copy; `href` and `kind` are both null until the firm decides where it goes, and are
        then both set, exactly as on a `Link`.
      properties:
        label:
          type: string
        href:
          type: [string, 'null']
        kind:
          oneOf:
            - $ref: '#/components/schemas/LinkKind'
            - type: 'null'

    SectionHeader:
      type: object
      additionalProperties: false
      required: [eyebrow, title, cta]
      description: The eyebrow/title/CTA trio that opens most sections. Unused parts are null.
      properties:
        eyebrow:
          type: [string, 'null']
        title:
          type: string
        cta:
          $ref: '#/components/schemas/NullableLink'

    IconItem:
      type: object
      additionalProperties: false
      required: [icon, title, text]
      properties:
        icon:
          type: string
          description: An icon key the frontend maps to its own icon set, such as `shield-plus`.
        title:
          type: string
        text:
          type: [string, 'null']

    Stat:
      type: object
      additionalProperties: false
      required: [value, caption, label]
      description: |
        Computed stats are already resolved here; the `source` field is admin-only.
      properties:
        value:
          type: string
          examples: ['59+ Years']
        caption:
          type: string
        label:
          type: string

    SeoBasic:
      type: object
      additionalProperties: false
      required: [title, description]
      description: |
        Search metadata for a collection item. Unlike a page's `Seo`, there is no
        `ogImage`: only pages carry an Open Graph image.
      properties:
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']

    Seo:
      type: object
      additionalProperties: false
      required: [title, description, ogImage]
      properties:
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        ogImage:
          $ref: '#/components/schemas/NullableImage'

    Hero:
      type: object
      additionalProperties: false
      required: [title, subtitle, images, primaryCta, secondaryCta]
      properties:
        title:
          type: string
        subtitle:
          type: [string, 'null']
        images:
          type: array
          description: |
            The hero's background slides. Only the image changes between slides; the title,
            subtitle and CTAs are shared. Home has three in the designs and every other hero
            one. Empty until the firm uploads a picture, the way a single image used to be null.
          items:
            $ref: '#/components/schemas/Image'
        primaryCta:
          $ref: '#/components/schemas/NullableLink'
        secondaryCta:
          $ref: '#/components/schemas/NullableLink'

    FilterOption:
      type: object
      additionalProperties: false
      required: [value, label]
      description: A filter tab. An empty `value` means "no filter", such as "Our Attorneys".
      properties:
        value:
          type: string
        label:
          type: string

    PersonRole:
      type: string
      enum:
        - managing_partner
        - partner
        - associate_partner
        - senior_associate
        - associate
        - trainee_associate

    PersonRoleFilter:
      type: string
      enum:
        - managing_partner
        - partner
        - associate_partner
        - senior_associate
        - associate
        - trainee_associate
      description: |
        The accepted values of the `role` query parameter. Same values as `PersonRole`, but
        `partner` behaves as a group and also matches `managing_partner`, mirroring the
        "Partners" tab in the designs. `managing_partner` is accepted for an exact match even
        though the directory shows no tab for it.

    InsightCategory:
      type: string
      enum:
        - firm_news
        - articles
        - insights
        - regulatory_updates
        - news_updates
        - events
        - pro_bono
      description: |
        `pro_bono` ("Pro Bono & Community Commitment") is not a listing tab: those insights are
        the Responsible Business page's stories, and appear in a listing only when
        `category=pro_bono` is asked for explicitly.

    InsightFormat:
      type: string
      enum: [article, video]
      description: Controls whether the card reads "Read More" or "Watch Video".

    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, internship, nysc]

    WorkMode:
      type: string
      enum: [onsite, hybrid, remote]

    PageKey:
      type: string
      enum:
        - home
        - about
        - practice-areas
        - people
        - insights
        - careers
        - faq
        - offices
        - recognition
        - responsible-business

    LegalPageKey:
      type: string
      enum: [terms, privacy]

    PracticeAreaRef:
      type: object
      additionalProperties: false
      required: [id, slug, title, shortLabel]
      description: A minimal practice area, used for chips and links.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        shortLabel:
          type: string
          description: The compact label used on the Home tab bar.

    PracticeAreaLink:
      type: object
      additionalProperties: false
      required: [slug, title]
      description: A practice area as a chip or a link — `/practice-areas/{slug}`.
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string

    IndustryRef:
      type: object
      additionalProperties: false
      required: [name, slug]
      description: An industry from the shared list practice areas pick from.
      properties:
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'

    CoreService:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string

    PracticeAreaApproach:
      type: object
      additionalProperties: false
      required: [text, points]
      properties:
        text:
          type: string
        points:
          type: array
          items:
            type: string

    PracticeAreaCard:
      type: object
      additionalProperties: false
      required: [id, slug, title, shortLabel, summary, image]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        shortLabel:
          type: string
        summary:
          type: string
        image:
          $ref: '#/components/schemas/NullableImage'

    PracticeAreaDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - shortLabel
        - summary
        - homeSummary
        - heroIntro
        - image
        - heroImages
        - overview
        - coreServices
        - approach
        - industries
        - lead
        - siblings
        - recentPublications
        - seo
      description: |
        The practice area detail page. The three texts differ by where they appear: `summary`
        on the Practice Areas grid card, `homeSummary` on the Home carousel card, and
        `heroIntro` in this page's hero.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        shortLabel:
          type: string
        summary:
          type: string
        homeSummary:
          type: string
        heroIntro:
          type: string
        image:
          $ref: '#/components/schemas/NullableImage'
        heroImages:
          type: array
          description: The detail hero's slides. Empty until the firm uploads them.
          items:
            $ref: '#/components/schemas/Image'
        overview:
          type: [string, 'null']
          description: The first paragraph of the page, as plain text.
        coreServices:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/CoreService'
        approach:
          oneOf:
            - $ref: '#/components/schemas/PracticeAreaApproach'
            - type: 'null'
        industries:
          type: array
          items:
            $ref: '#/components/schemas/IndustryRef'
        lead:
          oneOf:
            - $ref: '#/components/schemas/PracticeAreaLead'
            - type: 'null'
          description: The "Practice Lead" card. Null when no published attorney is assigned.
        siblings:
          type: array
          description: Every published practice area, in order, for the sidebar.
          items:
            $ref: '#/components/schemas/PracticeAreaLink'
        recentPublications:
          type: array
          maxItems: 6
          description: The latest insights tagged with this area, never pro bono stories.
          items:
            $ref: '#/components/schemas/InsightCard'
        seo:
          $ref: '#/components/schemas/SeoBasic'

    PracticeAreaLead:
      type: object
      additionalProperties: false
      required:
        [id, slug, displayName, role, roleLabel, photo, linkedinUrl, cardBio, practiceAreas, email]
      description: |
        The Practice Lead card: a person summary plus the email address behind the card's
        email icon. Photo and name always come from the linked attorney, so the card cannot
        disagree with their profile.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/PersonRole'
        roleLabel:
          type: string
        photo:
          $ref: '#/components/schemas/NullableImage'
        linkedinUrl:
          type: [string, 'null']
        cardBio:
          type: [string, 'null']
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaLink'
        email:
          type: [string, 'null']

    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, role, roleLabel, photo, linkedinUrl, cardBio, practiceAreas]
      description: |
        Used on directory cards, author blocks and the leadership row. `displayName` includes the
        honorific only when it is "Dr.", matching the designs, and appends any post-nominals.

        It carries the card's back face too — `cardBio` and the practice-area chips — so every
        card can flip without another request.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        displayName:
          type: string
          examples: ['Dr. Babatunde Ajibade, SAN']
        role:
          $ref: '#/components/schemas/PersonRole'
        roleLabel:
          type: string
          examples: ['Managing Partner']
        photo:
          $ref: '#/components/schemas/NullableImage'
        linkedinUrl:
          type: [string, 'null']
        cardBio:
          type: [string, 'null']
          description: The short italic line on the back of the card.
        practiceAreas:
          type: array
          description: The chips on the back of the card.
          items:
            $ref: '#/components/schemas/PracticeAreaLink'

    PersonEducation:
      type: object
      additionalProperties: false
      required: [intro, entries]
      properties:
        intro:
          type: [string, 'null']
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [qualification, year]
            properties:
              qualification:
                type: string
                examples:
                  ["Ph.D. in Private International Law, King's College, University of London"]
              year:
                type: [integer, 'null']

    PersonDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - displayName
        - firstName
        - lastName
        - honorific
        - postNominals
        - role
        - roleLabel
        - photo
        - linkedinUrl
        - instagramUrl
        - email
        - cardBio
        - bio
        - quote
        - primaryPracticeArea
        - practiceAreas
        - education
        - memberships
        - office
        - recentPublications
      description: The attorney profile. Email is public, shown on the profile.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        honorific:
          type: [string, 'null']
        postNominals:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/PersonRole'
        roleLabel:
          type: string
        photo:
          $ref: '#/components/schemas/NullableImage'
        linkedinUrl:
          type: [string, 'null']
        instagramUrl:
          type: [string, 'null']
        email:
          type: [string, 'null']
        cardBio:
          type: [string, 'null']
        bio:
          type: [string, 'null']
          description: Sanitised HTML, two or more paragraphs.
        quote:
          type: [string, 'null']
        primaryPracticeArea:
          oneOf:
            - $ref: '#/components/schemas/PracticeAreaLink'
            - type: 'null'
          description: Shown under the portrait.
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaLink'
        education:
          $ref: '#/components/schemas/PersonEducation'
        memberships:
          type: array
          items:
            type: string
        office:
          oneOf:
            - $ref: '#/components/schemas/OfficeRef'
            - type: 'null'
        recentPublications:
          type: array
          maxItems: 6
          description: The latest insights they wrote, never pro bono stories.
          items:
            $ref: '#/components/schemas/InsightCard'

    InsightAuthor:
      oneOf:
        - $ref: '#/components/schemas/InsightAuthorPerson'
        - $ref: '#/components/schemas/InsightAuthorFirm'
      discriminator:
        propertyName: type
        mapping:
          person: '#/components/schemas/InsightAuthorPerson'
          firm: '#/components/schemas/InsightAuthorFirm'
      description: An insight is written either by an attorney or by the firm itself.

    InsightAuthorPerson:
      type: object
      additionalProperties: false
      required: [type, person]
      properties:
        type:
          type: string
          enum: [person]
        person:
          $ref: '#/components/schemas/PersonSummary'

    InsightAuthorFirm:
      type: object
      additionalProperties: false
      required: [type, name, label]
      description: The frontend renders its own logo mark alongside these strings.
      properties:
        type:
          type: string
          enum: [firm]
        name:
          type: string
          examples: ['SPA AJIBADE & Co.']
        label:
          type: string
          examples: ['Law Firm']

    InsightCta:
      type: object
      additionalProperties: false
      required: [label, kind]
      properties:
        label:
          type: string
          examples: ['Read More']
        kind:
          type: string
          enum: [read_more, watch_video]

    InsightDetailCta:
      type: object
      additionalProperties: false
      required: [label, url]
      description: |
        The link at the end of an article or video: "Read Article" to the external article or
        uploaded PDF, or "Watch Video" to the video.
      properties:
        label:
          type: string
          examples: ['Read Article', 'Watch Video']
        url:
          type: string

    InsightCard:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - excerpt
        - format
        - categories
        - categoryLabels
        - practiceAreas
        - chips
        - author
        - coverImage
        - publishedAt
        - featured
        - cta
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        excerpt:
          type: [string, 'null']
        format:
          $ref: '#/components/schemas/InsightFormat'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InsightCategory'
        categoryLabels:
          type: array
          minItems: 1
          items:
            type: string
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        chips:
          type: array
          maxItems: 2
          description: |
            The two labels the card shows: the first category, then the first practice area.
            With no practice area, the second category is used instead.
          items:
            type: string
        author:
          $ref: '#/components/schemas/InsightAuthor'
        coverImage:
          $ref: '#/components/schemas/NullableImage'
        publishedAt:
          type: [string, 'null']
          format: date-time
        featured:
          type: boolean
        cta:
          $ref: '#/components/schemas/InsightCta'

    InsightDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - excerpt
        - format
        - categories
        - categoryLabels
        - practiceAreas
        - chips
        - author
        - coverImage
        - publishedAt
        - featured
        - cta
        - backLink
        - body
        - videoUrl
        - related
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
        excerpt:
          type: [string, 'null']
        format:
          $ref: '#/components/schemas/InsightFormat'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InsightCategory'
        categoryLabels:
          type: array
          minItems: 1
          items:
            type: string
        practiceAreas:
          type: array
          items:
            $ref: '#/components/schemas/PracticeAreaRef'
        chips:
          type: array
          maxItems: 2
          items:
            type: string
        author:
          $ref: '#/components/schemas/InsightAuthor'
        coverImage:
          $ref: '#/components/schemas/NullableImage'
        publishedAt:
          type: [string, 'null']
          format: date-time
        featured:
          type: boolean
        cta:
          oneOf:
            - $ref: '#/components/schemas/InsightDetailCta'
            - type: 'null'
          description: |
            Unlike a card's `cta`, a link with a destination. Null for an article with neither an
            external URL nor an uploaded document.
        backLink:
          $ref: '#/components/schemas/Link'
        body:
          type: [string, 'null']
          description: Sanitised HTML. Null for video insights.
        videoUrl:
          type: [string, 'null']
          description: Set when `format` is `video`.
        related:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InsightCard'

