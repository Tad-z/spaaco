            y: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        usedBy:
          type: array
          description: Computed from the media reference registry, not stored (ADR-013).
          items:
            $ref: '#/components/schemas/MediaUsage'

    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [file, alt]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, WebP or AVIF, at most 10 MB, verified by magic bytes.
        alt:
          type: string
          minLength: 1
          maxLength: 300
        title:
          type: string
          maxLength: 200

    MediaReplaceRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary

    MediaPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        alt: { type: string, minLength: 1, maxLength: 300 }
        title: { type: [string, 'null'], maxLength: 200 }
        focalPoint:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
