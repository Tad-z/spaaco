        leadership:
          type: array
          items:
            $ref: '#/components/schemas/PersonSummary'
        whyChooseUs:
          $ref: '#/components/schemas/HomeWhyChooseUs'
        insightsSection:
          $ref: '#/components/schemas/SectionHeader'
        latestInsights:
          type: array
